<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>ALTps3 Home</title>
    <style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: Arial, sans-serif;
        }

        .btn {
            display: inline-block;
            width: 170px;
            height: 120px;
            padding-top: 30px;
            background-color: #b3b3b3;
            border: 3px solid #4a4a4a;
            text-align: center;
            text-decoration: none;
            margin: 0 20px;
            -webkit-border-radius: 20px; 
            border-radius: 20px;
        }

        .btn:focus, .btn:hover {
            border-color: #ffffff;
            background-color: #cccccc;
        }

        .btn img {
            width: 100px;
            height: 70px;
            border: none;
            margin-bottom: 10px;
        }

        .btn-text {
            color: #1a1a1a;
            font-weight: bold;
            font-size: 22px;
            letter-spacing: 1px;
            display: block;
        }
    </style>
</head>
<body>

<table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" valign="middle">
            <a href="flashdumper/" class="btn">
                <img src="dump.png" alt="Dump">
                <span class="btn-text">DUMP</span>
            </a>
            <a href="flashwriter/" class="btn">
                <img src="flash.png" alt="Flash">
                <span class="btn-text">FLASH</span>
            </a>
        </td>
    </tr>
</table>
</body>
</html>
